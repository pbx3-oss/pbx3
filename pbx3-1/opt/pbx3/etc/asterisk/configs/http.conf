;
; This file is provided as part of the PBX3 Asterisk workbench.
; Package default uses snakeoil. LE / custom paths are rewritten by
; /opt/pbx3/scripts/apply-active-cert.sh (also makes LE keys group-readable
; for Asterisk so HTTPS/WSS on :8089 actually binds — required for WebRTC).
;

[general]

enabled=yes
bindaddr=0.0.0.0
bindport=8088
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/ssl/certs/ssl-cert-snakeoil.pem
tlsprivatekey=/etc/ssl/private/ssl-cert-snakeoil.key
