; rfc3842
; put empty "Content=>" at the end to have CRLF after last body line

[clear-mwi]
Event=>message-summary
Content-type=>application/simple-message-summary
Content=>Messages-Waiting: no
Content=>Message-Account: sip:asterisk@127.0.0.1
Content=>Voice-Message: 0/0 (0/0)
Content=>

; Aastra

[aastra-check-cfg]
Event=>check-sync

[aastra-xml]
Event=>aastra-xml

; Digium

[digium-check-cfg]
Event=>check-sync

; Fanvil

[fanvil-check-cfg]
Event=>check-sync

; Linksys

[linksys-cold-restart]
Event=>reboot_now

[linksys-warm-restart]
Event=>restart_now

; Panasonic KX-HDV

[panasonic-check-cfg]
Event=>check-sync


; Poly

[polycom-check-cfg]
Event=>check-sync

; Sipura

[sipura-check-cfg]
Event=>resync

; snom

[snom-check-cfg]
Event=>check-sync\;reboot=false

[snom-reboot]
Event=>check-sync\;reboot=true

; Yealink

[yealink-check-cfg]
Content-Type=>message/sipfrag
Event=>ACTION-URI
Content=>key=AutoP
Content=>

[yealink-reboot]
Event=>check-sync;reboot=true

; General

[general-check-cfg]
Event=>check-sync
