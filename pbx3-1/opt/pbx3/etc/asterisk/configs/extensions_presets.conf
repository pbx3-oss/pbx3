;
;  Internal presets which are available system-wide
;  SYSAGI is set in [globals] by the generator (config.php SYSAGI).
;
[internal-presets]
;
;	RCS Service Codes
;
;		
		exten => _*1[89][*],1,agi(${SYSAGI},${EXTEN},cfim,${CONTEXT},,,)	; DND ON/OFF
		exten => _*20[*],1,agi(${SYSAGI},${EXTEN},cfim,${CONTEXT},,,)		; DND TOGGLE

		exten => _*21*XX.,1,agi(${SYSAGI},${EXTEN},cfim,${CONTEXT},,,)		; cfim ON
		exten => _*21*,1,agi(${SYSAGI},${EXTEN},cfim,${CONTEXT},,,)		; cfim OFF

		exten => _*22*XX.,1,agi(${SYSAGI},${EXTEN},cfbs,${CONTEXT},,,)		; cfbs ON
		exten => _*22*,1,agi(${SYSAGI},${EXTEN},cfbs,${CONTEXT},,,)		; cfbs OFF		

		exten => _*23*,1,agi(${SYSAGI},${EXTEN},,${CONTEXT},,,)			; CF CLEAR

		exten => _*26[*],1,agi(${SYSAGI},${EXTEN},,${CONTEXT},,,)		; RingDelay
		exten => _*26[*]X,1,agi(${SYSAGI},${EXTEN},,${CONTEXT},,,)		; RingDelay
		exten => _*26[*]XX,1,agi(${SYSAGI},${EXTEN},,${CONTEXT},,,)	; RingDelay

        exten => *52*,1,PlayBack(demo-echotest)        		; Echotest
        exten => *52*,n,Echo
        exten => *52*,n,PlayBack(demo-echodone)
        exten => *55*,1,SayUnixTime(,,HMpABd)          		; SayTime/Date
        exten => *56*,1,PlayBack(vm-extension)
        exten => *56*,n,SayDigits(${CALLERID(num)})

;
;	Included from each tenant context; ${CONTEXT} supplies PARM_CLST (cluster shortuid).
;
        exten => _*60*XXXX,1,agi(${SYSAGI},${EXTEN},,${CONTEXT},,,)		; Greetings
        
        exten => _*6[34][*],1,agi(${SYSAGI},${EXTEN},,${CONTEXT},,,)		; Agent pause/unpause(63 64)
        exten => _*6[56][*],1,agi(${SYSAGI},${EXTEN},,${CONTEXT},,,)		; Agent Login/out(65 66)

        exten => _*67[*]XXXX,1,agi(${SYSAGI},${EXTEN},,${CONTEXT},,,)		; ChanSpy (Whisper)
        exten => _*67[*]XXX,1,agi(${SYSAGI},${EXTEN},,${CONTEXT},,,)		; ChanSpy (Whisper)        
        exten => _*68[*]XXXX,1,agi(${SYSAGI},${EXTEN},,${CONTEXT},,,)		; ChanSpy
        exten => _*68[*]XXX,1,agi(${SYSAGI},${EXTEN},,${CONTEXT},,,)		; ChanSpy
;
;
;


;
;	Wakeup call 
;	needs work for PJSIP and clusters



;
		exten => _*24[*],1,agi(kwakeup)
		exten => _*24[*]XXX,1,Authenticate(${SYSPASS})
		exten => _*24[*]XXX,n,agi(kwakeup,EXT${EXTEN:4})
		exten => _*24[*]XXXX,1,Authenticate(${SYSPASS})
		exten => _*24[*]XXXX,n,agi(kwakeup,EXT${EXTEN:4})
		exten => _***XXX,1,Set(CHANNEL(language)=${LANGUAGE})
		exten => _***XXX,n,Dial(PJSIP/${EXTEN:3},60)
		exten => _***XXXX,1,Set(CHANNEL(language)=${LANGUAGE})
		exten => _***XXXX,n,Dial(SIP/${EXTEN:3},60)

;
;	NANP Vertical Service Code Compatibility
;
       	exten => *60,1,GoTo(*55*,1) ; say time
       	exten => *65,1,GoTo(*56*,1) ; say extn num

       	exten => _*72X.,1,agi(${SYSAGI},*21*${EXTEN},,${CONTEXT},,,) 		;cfim ON
       	exten => *73,1,agi(${SYSAGI},*21*,,${CONTEXT},,,)					;cfim OFF

       	exten => _*77XXXX,1,agi(${SYSAGI},*60*${EXTEN},,${CONTEXT},,,)		;play a greeting;

       	exten => *78,1,agi(${SYSAGI},*18*,,${CONTEXT},,,)					;DND ON
       	exten => *79,1,agi(${SYSAGI},*19*,,${CONTEXT},,,)					;DND OFF

       	exten => _*90X.,1,agi(${SYSAGI},*22*${EXTEN},,${CONTEXT},,,)		;cfbs ON
       	exten => *91,1,agi(${SYSAGI},*22*,,${CONTEXT},,,)					;cfbs OFF

       	exten => *97,1,GoTo(*50*,1)								;DND ON
       	exten => *98,1,GoTo(*52*,1)								;DND OFF
       	exten => _*99XXXX,1,agi(${SYSAGI},*61*${EXTEN},,${CONTEXT},,,)
       	exten => i,1,Playtones(congestion)