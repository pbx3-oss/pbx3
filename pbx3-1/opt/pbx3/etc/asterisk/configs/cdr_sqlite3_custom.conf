;
; Asterisk Call Detail Record — SQLite3 custom backend (search HoR)
;
; Dual-write with cdr.conf [csv]: CSV remains the rotate→S3 archive path;
; this DB is for on-node searchable CDR (pbx3api GET /cdr).
; Database file: /var/log/asterisk/master.db (section name [master]).
;
; Asterisk 20.x (lab): use legacy columns/values (not advanced "fields").
; Spec: FLEET_LOG_RETENTION_REQUIREMENTS.md Phase 6
;
; calldate: UTC wall clock (align with cdr.conf [csv] usegmtime=yes).
; Do NOT use bare ${CDR(start)} — that is host local. Panel converts to site TZ.
; Policy: workingdocs/CDR_TIMEZONE_POLICY.md
;

[master]
table => cdr
busy_timeout => 1000

; Each of columns and values must be a single line; counts must match.
columns => calldate, clid, src, dst, dcontext, channel, dstchannel, lastapp, lastdata, duration, billsec, disposition, amaflags, accountcode, uniqueid, userfield, linkedid
values => '${STRFTIME(${CDR(start,u)},UTC,%Y-%m-%d %H:%M:%S)}','${CDR(clid)}','${CDR(src)}','${CDR(dst)}','${CDR(dcontext)}','${CDR(channel)}','${CDR(dstchannel)}','${CDR(lastapp)}','${CDR(lastdata)}','${CDR(duration)}','${CDR(billsec)}','${CDR(disposition)}','${CDR(amaflags)}','${CDR(accountcode)}','${CDR(uniqueid)}','${CDR(userfield)}','${CDR(linkedid)}'
