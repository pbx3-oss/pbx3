;
; Asterisk Call Management support
;

; By default asterisk will listen on localhost only. 
[general]
enabled = yes
port = 5038
bindaddr = 127.0.0.1
displayconnects = no

;
; PBX3 Asterisk Manager Interface
;
[pbx3]
secret=bgth7rf!
deny=0.0.0.0/0.0.0.0
permit=127.0.0.1/255.255.255.255
;
;writetimeout=100
;
;Authorization
read=all
write=all
