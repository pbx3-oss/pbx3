# PBX3 API (nginx HTTPS :44300) — bad User-Agents / scanners.
# Uses system filter apache-badbots (Ubuntu 24.04 ships this; nginx-badbots is not packaged).
# Regex matches nginx combined access.log: IP - - "GET ... HTTP/1.x" ... "User-Agent"
# Install: ln -sf /opt/pbx3/etc/fail2ban/jail.d/pbx3-api.conf /etc/fail2ban/jail.d/pbx3-api.conf

[pbx3-api-badbots]
enabled   = true
filter    = apache-badbots
logpath   = /var/log/nginx/access.log
maxretry  = 1
findtime  = 86400
bantime   = 86400
