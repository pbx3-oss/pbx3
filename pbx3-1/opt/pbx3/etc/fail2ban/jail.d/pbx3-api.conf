# PBX3 API (nginx HTTPS :44300) — bad User-Agents / scanners.
# Requires system filter nginx-badbots (Ubuntu 24.04 fail2ban package).
# Install: ln -sf /opt/pbx3/etc/fail2ban/jail.d/pbx3-api.conf /etc/fail2ban/jail.d/pbx3-api.conf
#
# API requests are logged to the default nginx access.log (pbx3-api.conf on 44300).

[nginx-badbots]
enabled   = true
filter    = nginx-badbots
logpath   = /var/log/nginx/access.log
maxretry  = 1
findtime  = 86400
bantime   = 86400
