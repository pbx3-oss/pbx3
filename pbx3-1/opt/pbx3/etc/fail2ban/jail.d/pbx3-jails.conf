# PBX3 core jails — Ubuntu 24.04 LTS
# Install: ln -sf /opt/pbx3/etc/fail2ban/jail.d/pbx3-jails.conf /etc/fail2ban/jail.d/pbx3-jails.conf
#
# Use jail.d fragments only (do not symlink a full jail.local — breaks %(auth_log)s
# interpolation on fail2ban 1.x). setip.php updates ignoreip in this file.
#
# SIP stance (fleet): instance :5060 is SBC-only. Asterisk Fail2ban must not ban —
# every REGISTER/INVITE source is an SBC peer. Phone/site ban+whitelist lives on the
# SBC. Keep SBC signaling IPs in ignoreip so pbx3:ops-register-loops can treat them
# as trusted peers for REGISTER-loop notify (email only).

[DEFAULT]
banaction = ufw
ignoreip = 127.0.0.1 224.0.1.0/24

[sshd]
enabled   = true
filter    = sshd
logpath   = /var/log/auth.log
maxretry  = 3
findtime  = 600
bantime   = 86400

# Disabled: SIP ACL is network-level (SBC-only). Banning Asterisk sources would only
# hit SBC IPs and break the trunk. REGISTER auth loops → ops email, not F2B.
[asterisk]
enabled   = false
filter    = asterisk
logpath   = /var/log/asterisk/messages
maxretry  = 5
findtime  = 600
bantime   = 600

[recidive]
enabled   = true
filter    = recidive
logpath   = /var/log/fail2ban.log
bantime   = 604800
findtime  = 86400
maxretry  = 3
