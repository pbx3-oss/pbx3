# Solo / direct home provision listener — HTTPS on :41363 (instance cert).
# Phones / RPS hit https://{instance-fqdn}:41363/provisioning/…
# Installed by install-provision-listener.sh (mode=solo|https).
# Active cert: include snippets/pbx3-ssl-active.conf (apply-active-cert.sh).

server {
    listen 41363 ssl;
    listen [::]:41363 ssl;
    server_name _;

    include snippets/pbx3-ssl-active.conf;

    # Small bodies only (config GET / rare PUT no-op).
    client_max_body_size 1M;

    access_log /var/log/nginx/pbx3-provision.access.log;
    error_log  /var/log/nginx/pbx3-provision.error.log warn;

    location = /provisioning {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/pbx3/php/provisioning/device.php;
        fastcgi_param SCRIPT_NAME /provisioning/device.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param PHP_VALUE "open_basedir=/opt/pbx3:/tmp:/proc:/etc/timezone";
    }

    location /provisioning/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/pbx3/php/provisioning/device.php;
        fastcgi_param SCRIPT_NAME /provisioning/device.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param PHP_VALUE "open_basedir=/opt/pbx3:/tmp:/proc:/etc/timezone";
    }

    location / {
        return 404;
    }
}
