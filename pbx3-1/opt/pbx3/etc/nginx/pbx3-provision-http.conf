# Fleet home provision listener — plain HTTP on :41363 (SBC-only via UFW).
# Edge terminates HTTPS at provision.{apex}:41363 and proxy_pass here.
# Installed by install-provision-listener.sh (mode=fleet|http).

server {
    listen 41363;
    listen [::]:41363;
    server_name _;

    client_max_body_size 1M;

    access_log /var/log/nginx/pbx3-provision.access.log;
    error_log  /var/log/nginx/pbx3-provision.error.log warn;

    location = /provisioning {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/pbx3/php/provisioning/device.php;
        fastcgi_param SCRIPT_NAME /provisioning/device.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param PHP_VALUE "open_basedir=/opt/pbx3:/tmp:/proc:/etc/timezone";
    }

    location /provisioning/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/pbx3/php/provisioning/device.php;
        fastcgi_param SCRIPT_NAME /provisioning/device.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param PHP_VALUE "open_basedir=/opt/pbx3:/tmp:/proc:/etc/timezone";
    }

    location / {
        return 404;
    }
}
