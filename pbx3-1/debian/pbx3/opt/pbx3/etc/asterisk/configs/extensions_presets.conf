       	exten => _*90X.,1,agi(gcsagi,*22*${EXTEN},,)		;cfbs ON
       	exten => *91,1,agi(gcsagi,*22*,,)					;cfbs OFF

       	exten => *97,1,GoTo(*50*,1)								;DND ON
       	exten => *98,1,GoTo(*52*,1)								;DND OFF
       	exten => _*99XXXX,1,agi(gcsagi,*61*${EXTEN},,)
