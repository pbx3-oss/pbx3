# mixed-office — quiet office wallpaper from PDH 2026-07-28 CDR
id: mixed-office
version: 1
description: >
  Low concurrency office day (PDH specimen). Morning hump; mostly inbound-shaped
  + some ext↔ext; ~16% multi-leg → queue. Start at CDR peak concurrent (4);
  raise concurrency.scale later if Home wallpaper needs more.

source:
  cdr: ~/GiT/nonGitStuff/pdh-2026-07-28.csv
  analyzed: 2026-07-31
  logical_calls: 152
  legs: 236
  notes: SARK/Asterisk Master.csv, no header; multi-leg uniqueids ≈ ring groups.

concurrency:
  target: 4
  scale: 1.0

timing:
  hold_ms:
    p50: 50000
    p90: 291000
    default: 50000
  interarrival_ms:
    busy_p50: 73000
  answer_weights:
    answered: 0.74
    no_answer: 0.22
    busy: 0.04
  hour_weights:
    # normalized call counts by hour (local CDR clock)
    "07": 5
    "08": 26
    "09": 19
    "10": 21
    "11": 10
    "12": 17
    "13": 18
    "14": 15
    "15": 13
    "16": 6

paths:
  domain_ext: 0.27
  numbers_in: 0.63
  numbers_out: 0.00
  other: 0.10
  to_queue: 0.16

queue:
  pkey: "2160"
  strategy: rrmemory
  agent_n: 4
  member_ext_first: 2120

# v1 implement slice: Domain dialers → queue 2160 (rrmemory) + 4 sippuac agents.
# Numbers in/out and hour schedule sampling come later.
