# Reference nginx config for pbx3api (API on port 44300).
# Copy/adapt this into pbx3api when adding nginx. Cert paths: pbx3 provides
# Let's Encrypt (or snakeoil); use same paths as Asterisk.
#
# Original Apache site had: VirtualHost *:44300, DocumentRoot /opt/pbx3api/public,
# LimitRequestBody ~40MB, open_basedir, PHP, SSL (snakeoil or LE).

server {
    listen [::]:44300 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
    # When using Let's Encrypt (pbx3):
    # ssl_certificate     /etc/letsencrypt/live/<fqdn>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<fqdn>/privkey.pem;

    root /opt/pbx3api/public;
    index index.php;
    client_max_body_size 40M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "open_basedir=/opt/pbx3api:/opt/pbx3:/etc:/tmp:/usr/share/asterisk:/var/spool/asterisk";
    }
}
